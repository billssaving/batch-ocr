<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TNVOCR Dashboard</title>

<style>
/* ------------------------------
   COLOR TOKENS (Dark + Light)
--------------------------------*/
:root {
  --neon-green: #39ff14;
  --neon-blue: #00e5ff;
  --neon-magenta: #ff00e6;
  --dark-bg: #0a0a0a;
  --dark-surface: #1a1a1a;
  --light-bg: #f7f7f7;
  --light-surface: #ffffff;
  --text-light: #e0e0e0;
  --text-dark: #111;
  --radius: 12px;
  --transition: 0.25s ease;
}

/* ------------------------------
   GLOBAL
--------------------------------*/
body {
  margin: 0;
  font-family: Inter, sans-serif;
  background: var(--dark-bg);
  color: var(--text-light);
  transition: var(--transition);
}

.light-mode {
  background: var(--light-bg);
  color: var(--text-dark);
}

/* ------------------------------
   SIDEBAR
--------------------------------*/
.sidebar {
  width: 240px;
  height: 100vh;
  background: var(--dark-surface);
  padding: 24px;
  position: fixed;
  top: 0;
  left: 0;
  border-right: 1px solid rgba(255,255,255,0.1);
  transition: var(--transition);
}

.light-mode .sidebar {
  background: var(--light-surface);
  border-right: 1px solid #ddd;
}

.sidebar h1 {
  font-family: Montserrat, sans-serif;
  font-size: 24px;
  margin-bottom: 40px;
  letter-spacing: 1px;
  background: linear-gradient(90deg, var(--neon-green), var(--neon-blue));
  -webkit-background-clip: text;
  color: transparent;
}

.nav-item {
  padding: 12px 0;
  font-size: 16px;
  cursor: pointer;
  transition: var(--transition);
}

.nav-item:hover {
  color: var(--neon-blue);
}

/* ------------------------------
   HEADER
--------------------------------*/
.header {
  margin-left: 240px;
  height: 70px;
  display: flex;
  align-items: center;
  padding: 0 32px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  background: var(--dark-surface);
  transition: var(--transition);
}

.light-mode .header {
  background: var(--light-surface);
  border-bottom: 1px solid #ddd;
}

.toggle-btn {
  margin-left: auto;
  padding: 10px 18px;
  border-radius: var(--radius);
  border: 1px solid var(--neon-blue);
  background: transparent;
  color: var(--neon-blue);
  cursor: pointer;
  transition: var(--transition);
}

.toggle-btn:hover {
  background: var(--neon-blue);
  color: #000;
}

/* ------------------------------
   MAIN CONTENT
--------------------------------*/
.main {
  margin-left: 240px;
  padding: 32px;
}

.card {
  background: var(--dark-surface);
  padding: 24px;
  border-radius: var(--radius);
  margin-bottom: 24px;
  border: 1px solid rgba(255,255,255,0.1);
  transition: var(--transition);
}

.light-mode .card {
  background: var(--light-surface);
  border: 1px solid #ddd;
}

.card h2 {
  margin-top: 0;
  font-family: Montserrat, sans-serif;
  background: linear-gradient(90deg, var(--neon-green), var(--neon-blue));
  -webkit-background-clip: text;
  color: transparent;
}

.upload-btn {
  padding: 14px 22px;
  border-radius: var(--radius);
  border: none;
  background: linear-gradient(90deg, var(--neon-green), var(--neon-blue));
  color: #000;
  font-weight: bold;
  cursor: pointer;
  transition: var(--transition);
}

.upload-btn:hover {
  filter: brightness(1.2);
}
</style>

</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h1>TNVOCR</h1>
  <div class="nav-item">Dashboard</div>
  <div class="nav-item">Upload OCR</div>
  <div class="nav-item">Batch History</div>
  <div class="nav-item">CSV Merge</div>
  <div class="nav-item">Cloud Storage</div>
  <div class="nav-item">Settings</div>
  <div class="nav-item">Account</div>
</div>

<!-- HEADER -->
<div class="header">
  <button class="toggle-btn" onclick="toggleMode()">Toggle Light Mode</button>
</div>

<!-- MAIN -->
<div class="main">
  <div class="card">
    <h2>Upload OCR</h2>
    <p>Select your PNG files and extract text instantly.</p>
    <button class="upload-btn">Upload Files</button>
  </div>

  <div class="card">
    <h2>Batch History</h2>
    <p>View your previous OCR jobs and download results.</p>
  </div>

  <div class="card">
    <h2>Cloud Storage</h2>
    <p>Access your saved files and manage your data.</p>
  </div>
</div>

<script>
function toggleMode() {
  document.body.classList.toggle("light-mode")
}
</script>

</body>
</html>
